metadata_evidence:
  BIS_units: https://stats.bis.org/api/v1/dataflow/BIS/WS_EER/latest?references=all
  BIS_property: https://stats.bis.org/api/v1/dataflow/BIS/WS_SPP/latest?references=all
  IMF_fiscal: https://api.imf.org/external/sdmx/2.1/dataflow/IMF.RES/WEO/9.0.0?references=all
  Eurostat_current_catalogue: https://ec.europa.eu/eurostat/api/dissemination/catalogue/toc/txt?lang=en
remaining_limitations:
- Source-wide terms are conditional or unverified; all outputs stay local and ignored.
- No quarterly fiscal ratios or IMF current-account ratio fallback added; annual fiscal
  and OECD current-account mappings retain native frequencies.
- ECB M3 is the EA aggregate only, never assigned as national broad money.
- EA source composition is visible; fixed-composition Eurostat fallback differs from
  changing-composition ECB M3.
- BIS seasonal-adjustment metadata is unavailable in these payloads and flagged UNKNOWN.
