    na_item: P51G
  unit: EUR
  unit_mult: 6
  sa_flag: SA
  price_basis: chain_linked_volume
  base_year: '2010'
  flags:
  - calendar_adjusted
  - chain_linked_volumes_nonadditive
- concept: cons_gov
  dataset: namq_10_gdp
  filters:
    unit: CLV10_MEUR
    s_adj: SCA
    na_item: P3_S13
  unit: EUR
  unit_mult: 6
  sa_flag: SA
  price_basis: chain_linked_volume
  base_year: '2010'
  flags:
  - calendar_adjusted
