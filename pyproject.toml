[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "macrolab"
version = "1.0.0"
description = "Local, reproducible macroeconomic analysis — validated local engine"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
authors = [{name = "Hakan Zeki Gülmez"}]
dependencies = [
  "PyYAML>=6.0.2,<7",
  "openpyxl>=3.1.5,<4",
  "pandas>=2.2,<4",
  "pyarrow>=19,<25",
  "numpy>=1.26,<3",
  "scipy>=1.14,<2",
  "statsmodels>=0.14.5,<0.15",
  "arch>=7,<9",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "jsonschema>=4.23,<5",
  "httpx>=0.28,<1",
  "quantecon>=0.8,<1",
  "xlrd>=2.0.1,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "types-PyYAML>=6.0.12",
  "types-openpyxl>=3.1.5",
  "pandas-stubs>=2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/macrolab"]

[tool.uv]
default-groups = ["dev"]
index-url = "https://pypi.org/simple"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/macrolab"]

[[tool.mypy.overrides]]
module = "macrolab.models.*"
strict = true
